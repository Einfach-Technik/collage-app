<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Collage</title>
<meta name="description" content="Fotos zu einer Collage zusammensetzen – direkt auf dem Gerät.">
<meta name="theme-color" content="#111114">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Collage">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<style>
:root {
  --bg: #f2f2f5;
  --panel: #ffffff;
  --text: #1c1c1e;
  --muted: #6e6e73;
  --line: #d8d8de;
  --accent: #0a84ff;
  --accent-text: #ffffff;
  --chip: #e9e9ee;
  --danger: #d70015;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #111114;
    --panel: #1c1c20;
    --text: #f2f2f7;
    --muted: #9a9aa2;
    --line: #34343a;
    --chip: #2a2a30;
    --danger: #ff6961;
  }
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; height: 100%; }
body {
  background: var(--bg);
  color: var(--text);
  font: 16px/1.35 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  display: flex;
  flex-direction: column;
  overscroll-behavior: none;
  -webkit-user-select: none;
  user-select: none;
}
header {
  padding: calc(env(safe-area-inset-top) + 10px) 16px 8px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
}
header h1 { font-size: 20px; margin: 0; }
button {
  font: inherit;
  color: inherit;
  background: var(--chip);
  border: 0;
  border-radius: 10px;
  padding: 9px 14px;
  cursor: pointer;
}
button.primary { background: var(--accent); color: var(--accent-text); font-weight: 600; }
button.danger { color: var(--danger); }
button:disabled { opacity: .4; cursor: default; }
button.active { outline: 2px solid var(--accent); }

#stage {
  flex: 1 1 auto;
  min-height: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 4px 16px 12px;
}
#canvasWrap { position: relative; touch-action: none; }
canvas#preview {
  display: block;
  border-radius: 6px;
  box-shadow: 0 4px 24px rgba(0,0,0,.25);
  touch-action: none;
}
#empty {
  position: absolute; inset: 0;
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  gap: 12px; text-align: center; padding: 24px;
  color: var(--muted);
}

#panel {
  background: var(--panel);
  border-top: 1px solid var(--line);
  border-radius: 16px 16px 0 0;
  padding-bottom: env(safe-area-inset-bottom);
}
#tabs {
  display: flex;
  gap: 4px;
  padding: 8px 8px 0;
}
#tabs button {
  flex: 1;
  background: none;
  padding: 8px 4px;
  border-radius: 8px;
  color: var(--muted);
  font-size: 14px;
}
#tabs button.on { color: var(--accent); background: var(--chip); font-weight: 600; }
#tabBody {
  padding: 12px 16px;
  height: 200px;
  overflow-y: auto;
  -webkit-overflow-scrolling: touch;
}
.row { display: flex; align-items: center; gap: 12px; margin-bottom: 10px; }
.row > label { flex: 0 0 84px; color: var(--muted); font-size: 14px; }
.row input[type=range] { flex: 1; min-width: 0; accent-color: var(--accent); }
.row output { flex: 0 0 44px; text-align: right; font-variant-numeric: tabular-nums; font-size: 14px; }
.scroller { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 6px; -webkit-overflow-scrolling: touch; }
.scroller button { flex: 0 0 auto; }
.layout-btn { width: 64px; height: 64px; padding: 4px; }
.layout-btn canvas { width: 100%; height: 100%; display: block; }
.swatch {
  flex: 0 0 auto; width: 36px; height: 36px; border-radius: 50%;
  border: 2px solid var(--line); padding: 0;
}
.swatch.on { border-color: var(--accent); box-shadow: 0 0 0 2px var(--accent); }
input[type=color] { width: 44px; height: 36px; border: 0; padding: 0; background: none; }
.hint { color: var(--muted); font-size: 13px; margin: 0 0 8px; }
.actions { display: flex; gap: 8px; flex-wrap: wrap; }
.sel-actions { display: flex; gap: 8px; margin-top: 4px; flex-wrap: wrap; }
select {
  font: inherit; color: inherit; background: var(--chip);
  border: 0; border-radius: 10px; padding: 9px 12px;
}
#toast {
  position: fixed; left: 50%; bottom: calc(env(safe-area-inset-bottom) + 250px);
  transform: translateX(-50%); background: rgba(0,0,0,.8); color: #fff;
  padding: 10px 16px; border-radius: 10px; font-size: 14px; opacity: 0;
  pointer-events: none; transition: opacity .2s; max-width: 90vw; text-align: center;
}
#toast.show { opacity: 1; }
input[type=file] { display: none; }
input[type=text] {
  flex: 1; min-width: 0; font: inherit; color: inherit; background: var(--chip);
  border: 0; border-radius: 10px; padding: 8px 10px;
  -webkit-user-select: text; user-select: text;
}
.row button.small { flex: 0 0 auto; padding: 8px 10px; font-size: 14px; }
.thumb { position: relative; flex: 0 0 auto; width: 56px; height: 56px; }
.thumb canvas { width: 100%; height: 100%; border-radius: 8px; display: block; }
.thumb .x {
  position: absolute; top: -6px; right: -6px; width: 22px; height: 22px;
  border-radius: 50%; padding: 0; background: var(--danger); color: #fff;
  font-size: 14px; line-height: 22px;
}
#done {
  position: fixed; inset: 0; background: rgba(0,0,0,.5); z-index: 10;
  display: flex; align-items: flex-end; justify-content: center;
  padding: 16px 16px calc(env(safe-area-inset-bottom) + 16px);
}
#done[hidden] { display: none; }
#done .card {
  background: var(--panel); border-radius: 16px; padding: 20px;
  width: 100%; max-width: 420px; display: flex; flex-direction: column; gap: 10px;
}
#done h2 { margin: 0 0 4px; font-size: 18px; }
</style>
</head>
<body>

<header>
  <h1>Collage</h1>
  <div class="actions">
    <button id="btnNew" disabled>Neu</button>
    <button id="btnAdd">+ Fotos</button>
    <button id="btnSave" class="primary" disabled>Speichern</button>
  </div>
</header>

<div id="stage">
  <div id="canvasWrap">
    <canvas id="preview"></canvas>
    <div id="empty">
      <div style="font-size:44px">🖼️</div>
      <div>Wähle Fotos aus, um eine Collage zu erstellen.</div>
      <button class="primary" id="btnAdd2">Fotos auswählen</button>
    </div>
  </div>
</div>

<div id="panel">
  <div id="tabs">
    <button data-tab="layout" class="on">Layout</button>
    <button data-tab="style">Stil</button>
    <button data-tab="text">Text</button>
    <button data-tab="photo">Foto</button>
    <button data-tab="export">Export</button>
  </div>
  <div id="tabBody"></div>
</div>

<input type="file" id="file" accept="image/*" multiple>
<div id="toast"></div>

<div id="done" hidden>
  <div class="card">
    <h2>Collage gespeichert</h2>
    <button class="primary" id="doneNew">Neue Collage beginnen</button>
    <button id="doneKeep">Weiter bearbeiten</button>
  </div>
</div>

<script>
"use strict";

/* ---------- Zustand ---------- */
const ASPECTS = [
  ["1:1", 1, 1], ["4:5", 4, 5], ["3:4", 3, 4], ["9:16", 9, 16], ["16:9", 16, 9], ["3:2", 3, 2], ["2:3", 2, 3]
];
const COLORS = ["#ffffff", "#000000", "#f5efe6", "#1f2937", "#ff6b6b", "#ffd166", "#06d6a0", "#4dabf7", "#b197fc"];
const MAX_SRC = 2400;      // Quellbilder werden darauf verkleinert (Speicher)
const MAX_PHOTOS = 12;

const state = {
  photos: [],              // { src: canvas, zoom, ox, oy }
  layoutIndex: 0,
  aspect: 0,
  gap: 8,                  // in Prozent der kürzeren Seite * 10 (siehe unit())
  pad: 8,
  radius: 0,
  bg: "#ffffff",
  selected: -1,
  swapMode: false,
  format: "jpeg",
  size: 2160,
  textOn: false,
  showDate: true,
  showPlace: true,
  textPos: "bl",           // t/b = oben/unten, l/c/r = links/Mitte/rechts
  textSize: 14,
  textColor: "#ffffff",
  textBg: "outline",       // outline | bar | none
  dateFmt: "num",          // num | long | month
  textMode: "photos",      // photos | strip | both
  stripText: "",           // eigener Text für den Bereich (leer = automatisch)
  tab: "layout"
};
const PERSIST = ["aspect", "gap", "pad", "radius", "bg", "format", "size",
  "textOn", "showDate", "showPlace", "textPos", "textSize", "textColor", "textBg", "dateFmt", "textMode"];
const FONT = '-apple-system, "Segoe UI", Roboto, sans-serif';
const TEXT_COLORS = ["#ffffff", "#000000", "#ffd166", "#ff6b6b"];

try {
  const saved = JSON.parse(localStorage.getItem("collage-settings") || "{}");
  for (const k of PERSIST) {
    if (saved[k] !== undefined) state[k] = saved[k];
  }
} catch (e) {}
function persist() {
  try {
    const out = {};
    for (const k of PERSIST) out[k] = state[k];
    localStorage.setItem("collage-settings", JSON.stringify(out));
  } catch (e) {}
}

/* ---------- Layouts ---------- */
// Ein Layout ist eine Liste von Rechtecken [x, y, w, h] im Einheitsquadrat.
function rowsLayout(counts) {
  const out = [], rh = 1 / counts.length;
  counts.forEach((c, r) => { for (let i = 0; i < c; i++) out.push([i / c, r * rh, 1 / c, rh]); });
  return out;
}
function colsLayout(counts) {
  return rowsLayout(counts).map(([x, y, w, h]) => [y, x, h, w]);
}
function distribute(n, parts) {
  const base = Math.floor(n / parts), extra = n % parts;
  return Array.from({ length: parts }, (_, i) => base + (i < extra ? 1 : 0));
}
function layoutsFor(n) {
  const list = [], seen = new Set();
  const add = (name, rects) => {
    const key = JSON.stringify(rects.map(r => r.map(v => +v.toFixed(3))));
    if (!seen.has(key)) { seen.add(key); list.push({ name, rects }); }
  };
  if (n <= 1) { add("Einzeln", [[0, 0, 1, 1]]); return list; }
  const maxParts = Math.min(n, 5);
  for (let r = 1; r <= maxParts; r++) add(`${r} Zeilen`, rowsLayout(distribute(n, r)));
  for (let c = 1; c <= maxParts; c++) add(`${c} Spalten`, colsLayout(distribute(n, c)));
  if (n >= 3 && n <= 7) {
    const rest = n - 1;
    add("Groß links", [[0, 0, .6, 1], ...Array.from({ length: rest }, (_, i) => [.6, i / rest, .4, 1 / rest])]);
    add("Groß oben", [[0, 0, 1, .6], ...Array.from({ length: rest }, (_, i) => [i / rest, .6, 1 / rest, .4])]);
    add("Groß rechts", [[.4, 0, .6, 1], ...Array.from({ length: rest }, (_, i) => [0, i / rest, .4, 1 / rest])]);
    add("Groß unten", [[0, .4, 1, .6], ...Array.from({ length: rest }, (_, i) => [i / rest, 0, 1 / rest, .4])]);
  }
  // Ausgewogene Layouts (Felder nahe am Quadrat) zuerst, damit die Vorauswahl brauchbar ist.
  const score = l => l.rects.reduce((s, r) => s + Math.abs(Math.log(r[2] / r[3])), 0) / l.rects.length;
  return list.map((l, i) => ({ l, i, s: score(l) })).sort((a, b) => a.s - b.s || a.i - b.i).map(o => o.l);
}
let layouts = layoutsFor(0);
function currentLayout() {
  return layouts[Math.min(state.layoutIndex, layouts.length - 1)];
}

/* ---------- Zeichnen ---------- */
// Abstände sind relativ zur kürzeren Seite, damit Vorschau und Export gleich aussehen.
function unit(W, H, v) { return Math.min(W, H) * v / 400; }

function cellRects(W, H) {
  const lay = currentLayout();
  if (!lay) return [];
  const pad = unit(W, H, state.pad), gap = unit(W, H, state.gap);
  const strip = stripInfo(W, H);     // eigener Textbereich oben/unten verkleinert die Fotofläche
  const y0 = strip && state.textPos[0] === "t" ? strip.h : 0;
  const hh = strip ? H - strip.h : H;
  const ax = pad - gap / 2, ay = y0 + pad - gap / 2;
  const aw = W - 2 * pad + gap, ah = hh - 2 * pad + gap;
  return lay.rects.map(([x, y, w, h]) => ({
    x: ax + x * aw + gap / 2,
    y: ay + y * ah + gap / 2,
    w: w * aw - gap,
    h: h * ah - gap
  }));
}

function roundRect(ctx, x, y, w, h, r) {
  r = Math.max(0, Math.min(r, w / 2, h / 2));
  ctx.beginPath();
  if (r === 0) { ctx.rect(x, y, w, h); return; }
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r);
  ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
}

function drawPhoto(ctx, p, r) {
  const iw = p.src.width, ih = p.src.height;
  const s = Math.max(r.w / iw, r.h / ih) * p.zoom;
  const dw = iw * s, dh = ih * s;
  const x = r.x + (r.w - dw) / 2 + p.ox * (dw - r.w) / 2;
  const y = r.y + (r.h - dh) / 2 + p.oy * (dh - r.h) / 2;
  ctx.drawImage(p.src, x, y, dw, dh);
}

function render(ctx, W, H, ui) {
  ctx.fillStyle = state.bg;
  ctx.fillRect(0, 0, W, H);
  const rects = cellRects(W, H);
  const rad = unit(W, H, state.radius);
  rects.forEach((r, i) => {
    const p = state.photos[i];
    if (!p) return;
    ctx.save();
    roundRect(ctx, r.x, r.y, r.w, r.h, rad);
    ctx.clip();
    drawPhoto(ctx, p, r);
    drawCaption(ctx, p, r, W, H);
    ctx.restore();
  });
  const strip = stripInfo(W, H);
  if (strip) drawStrip(ctx, strip, W, H);
  if (ui && state.selected >= 0 && rects[state.selected]) {
    const r = rects[state.selected];
    ctx.save();
    ctx.lineWidth = 3;
    ctx.strokeStyle = state.swapMode ? "#ff9f0a" : "#0a84ff";
    roundRect(ctx, r.x + 1.5, r.y + 1.5, r.w - 3, r.h - 3, rad);
    ctx.stroke();
    ctx.restore();
  }
}

/* ---------- EXIF (Aufnahmedatum, GPS) ---------- */
function readExif(buf) {
  const out = {};
  try {
    const v = new DataView(buf);
    if (v.getUint16(0) !== 0xFFD8) return out;
    let off = 2;
    while (off + 4 < v.byteLength) {
      const marker = v.getUint16(off);
      if ((marker & 0xFF00) !== 0xFF00 || marker === 0xFFDA) break;
      if (marker === 0xFFE1 && v.getUint32(off + 4) === 0x45786966) { parseTiff(v, off + 10, out); break; }
      off += 2 + v.getUint16(off + 2);
    }
  } catch (e) {}
  return out;
}
function parseTiff(v, base, out) {
  const le = v.getUint16(base) === 0x4949;
  const u16 = o => v.getUint16(o, le), u32 = o => v.getUint32(o, le);
  const readIfd = off => {
    const map = {}, n = u16(base + off);
    for (let i = 0; i < n; i++) {
      const e = base + off + 2 + i * 12;
      map[u16(e)] = { count: u32(e + 4), at: e + 8 };
    }
    return map;
  };
  const str = t => {
    const pos = t.count > 4 ? base + u32(t.at) : t.at;
    let s = "";
    for (let i = 0; i < t.count - 1; i++) s += String.fromCharCode(v.getUint8(pos + i));
    return s;
  };
  const rats = t => {
    const pos = base + u32(t.at);
    return [0, 1, 2].map(i => u32(pos + i * 8) / (u32(pos + i * 8 + 4) || 1));
  };
  const ifd0 = readIfd(u32(base + 4));
  let dt = null;
  if (ifd0[0x8769]) {
    const exif = readIfd(u32(ifd0[0x8769].at));
    if (exif[0x9003]) dt = str(exif[0x9003]);
  }
  if (!dt && ifd0[0x0132]) dt = str(ifd0[0x0132]);
  const m = dt && /^(\d{4}):(\d{2}):(\d{2})/.exec(dt);
  if (m && +m[1] > 1900 && +m[2] >= 1 && +m[2] <= 12 && +m[3] >= 1) out.date = { y: +m[1], m: +m[2], d: +m[3] };
  if (ifd0[0x8825]) {
    const gps = readIfd(u32(ifd0[0x8825].at));
    if (gps[1] && gps[2] && gps[3] && gps[4] && gps[2].count === 3 && gps[4].count === 3) {
      const dms = a => a[0] + a[1] / 60 + a[2] / 3600;
      let lat = dms(rats(gps[2])), lon = dms(rats(gps[4]));
      if (str(gps[1]).startsWith("S")) lat = -lat;
      if (str(gps[3]).startsWith("W")) lon = -lon;
      if (isFinite(lat) && isFinite(lon) && (lat !== 0 || lon !== 0)) { out.lat = lat; out.lon = lon; }
    }
  }
}
async function readMeta(file) {
  let ex = {};
  try { ex = readExif(await file.slice(0, 262144).arrayBuffer()); } catch (e) {}
  return { date: ex.date || null, lat: ex.lat ?? null, lon: ex.lon ?? null, place: "", dateText: null };
}

/* ---------- Beschriftung (Ort, Datum) ---------- */
function fmtDate(d) {
  if (!d) return "";
  const dt = new Date(d.y, d.m - 1, d.d);
  const two = n => String(n).padStart(2, "0");
  if (state.dateFmt === "long") return dt.toLocaleDateString("de-DE", { day: "numeric", month: "long", year: "numeric" });
  if (state.dateFmt === "month") return dt.toLocaleDateString("de-DE", { month: "long", year: "numeric" });
  return `${two(d.d)}.${two(d.m)}.${d.y}`;
}
function isLight(hex) {
  const n = parseInt(hex.slice(1), 16);
  return 0.299 * (n >> 16) + 0.587 * ((n >> 8) & 255) + 0.114 * (n & 255) > 150;
}
function placeText(p) { return p.showPlace && p.place ? p.place : ""; }
function dateTextOf(p) {
  if (!p.showDate) return "";
  return p.dateText !== null ? p.dateText : fmtDate(p.date);
}
function captionLines(p) {
  if (!state.textOn || state.textMode === "strip") return [];
  return [placeText(p), dateTextOf(p)].filter(Boolean);
}

// Gemeinsamer Textbereich: alle Orte einmal, Datum oder Zeitraum.
function stripLines() {
  if (!state.textOn || state.textMode === "photos") return [];
  const custom = state.stripText.trim();
  if (custom) return [custom];
  const lines = [];
  const places = [...new Set(state.photos.map(placeText).filter(Boolean))];
  if (places.length) lines.push(places.join(" · "));
  const shown = state.photos.filter(p => p.showDate);
  let date = "";
  if (shown.some(p => p.dateText !== null)) {
    date = [...new Set(shown.map(dateTextOf).filter(Boolean))].join(" · ");
  } else {
    const ds = shown.filter(p => p.date).map(p => p.date)
      .sort((a, b) => (a.y - b.y) || (a.m - b.m) || (a.d - b.d));
    if (ds.length) {
      const first = fmtDate(ds[0]), last = fmtDate(ds[ds.length - 1]);
      date = first === last ? first : `${first} – ${last}`;
    }
  }
  if (date) lines.push(date);
  return lines;
}
const measureCtx = document.createElement("canvas").getContext("2d");
function stripInfo(W, H) {
  const lines = stripLines();
  if (!lines.length) return null;
  let size = unit(W, H, state.textSize);
  measureCtx.font = `600 ${size}px ${FONT}`;
  const widest = Math.max(...lines.map(l => measureCtx.measureText(l).width));
  if (widest > W * 0.92) size *= W * 0.92 / widest;
  const lh = size * 1.25;
  return { lines, size, lh, h: lines.length * lh + size * 1.6 };
}
function drawStrip(ctx, s, W, H) {
  const top = state.textPos[0] === "t", al = state.textPos[1];
  const m = Math.max(unit(W, H, state.pad), s.size * 0.8);
  const x = al === "l" ? m : al === "r" ? W - m : W / 2;
  const y0 = top ? 0 : H - s.h;
  ctx.save();
  ctx.font = `600 ${s.size}px ${FONT}`;
  ctx.fillStyle = isLight(state.bg) ? "#111114" : "#ffffff";   // passt sich dem Hintergrund an
  ctx.textAlign = al === "l" ? "left" : al === "r" ? "right" : "center";
  ctx.textBaseline = "top";
  s.lines.forEach((l, i) => ctx.fillText(l, x, y0 + s.size * 0.8 + i * s.lh));
  ctx.restore();
}
function drawCaption(ctx, p, r, W, H) {
  const lines = captionLines(p);
  if (!lines.length) return;
  const family = FONT;
  let size = unit(W, H, state.textSize);
  ctx.font = `600 ${size}px ${family}`;
  const widest = Math.max(...lines.map(l => ctx.measureText(l).width));
  if (widest > r.w * 0.9) {
    size *= r.w * 0.9 / widest;
    ctx.font = `600 ${size}px ${family}`;
  }
  const lh = size * 1.25, pad = size * 0.7, h = lines.length * lh;
  const top = state.textPos[0] === "t", al = state.textPos[1];
  const bar = state.textBg === "bar";
  if (bar) {
    const bandH = h + pad * 1.4;
    ctx.fillStyle = isLight(state.textColor) ? "rgba(0,0,0,.5)" : "rgba(255,255,255,.6)";
    ctx.fillRect(r.x, top ? r.y : r.y + r.h - bandH, r.w, bandH);
  }
  const inset = bar ? pad * 0.7 : pad;
  const yTop = top ? r.y + inset : r.y + r.h - inset - h;
  const x = al === "l" ? r.x + pad : al === "r" ? r.x + r.w - pad : r.x + r.w / 2;
  ctx.textAlign = al === "l" ? "left" : al === "r" ? "right" : "center";
  ctx.textBaseline = "top";
  ctx.lineJoin = "round";
  lines.forEach((l, i) => {
    const y = yTop + i * lh;
    if (state.textBg === "outline") {
      ctx.lineWidth = size * 0.2;
      ctx.strokeStyle = isLight(state.textColor) ? "rgba(0,0,0,.7)" : "rgba(255,255,255,.8)";
      ctx.strokeText(l, x, y);
    }
    ctx.fillStyle = state.textColor;
    ctx.fillText(l, x, y);
  });
}

/* ---------- Vorschau ---------- */
const preview = document.getElementById("preview");
const pctx = preview.getContext("2d");
let view = { w: 300, h: 300 };

function fitPreview() {
  const stage = document.getElementById("stage");
  const [, aw, ah] = ASPECTS[state.aspect];
  const availW = stage.clientWidth - 32, availH = stage.clientHeight - 16;
  let w = availW, h = w * ah / aw;
  if (h > availH) { h = availH; w = h * aw / ah; }
  w = Math.max(80, Math.floor(w)); h = Math.max(80, Math.floor(h));
  const dpr = Math.min(window.devicePixelRatio || 1, 3);
  view = { w, h };
  preview.style.width = w + "px";
  preview.style.height = h + "px";
  preview.width = Math.round(w * dpr);
  preview.height = Math.round(h * dpr);
  pctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  redraw();
}
let raf = 0;
function redraw() {
  if (raf) return;
  raf = requestAnimationFrame(() => { raf = 0; render(pctx, view.w, view.h, true); });
}

/* ---------- Bilder laden ---------- */
function loadImage(file) {
  return new Promise((resolve, reject) => {
    const url = URL.createObjectURL(file);
    const img = new Image();
    img.onload = () => {
      const scale = Math.min(1, MAX_SRC / Math.max(img.naturalWidth, img.naturalHeight));
      const c = document.createElement("canvas");
      c.width = Math.max(1, Math.round(img.naturalWidth * scale));
      c.height = Math.max(1, Math.round(img.naturalHeight * scale));
      c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
      URL.revokeObjectURL(url);
      resolve(c);
    };
    img.onerror = () => { URL.revokeObjectURL(url); reject(new Error(file.name)); };
    img.src = url;
  });
}

async function addFiles(files) {
  const list = [...files].filter(f => f.type.startsWith("image/") || /\.(heic|heif)$/i.test(f.name));
  const room = MAX_PHOTOS - state.photos.length;
  if (list.length > room) toast(`Maximal ${MAX_PHOTOS} Fotos – der Rest wurde ignoriert.`);
  let failed = 0;
  for (const f of list.slice(0, Math.max(0, room))) {
    try {
      const meta = await readMeta(f);
      state.photos.push({ src: await loadImage(f), zoom: 1, ox: 0, oy: 0, showPlace: state.showPlace, showDate: state.showDate, ...meta });
    } catch (e) { failed++; }
  }
  if (failed) toast(`${failed} Foto(s) konnten nicht geladen werden.`);
  afterPhotosChanged();
}

let lastCount = -1;
function afterPhotosChanged() {
  const n = state.photos.length;
  if (n !== lastCount) state.layoutIndex = 0;
  lastCount = n;
  layouts = layoutsFor(n);
  state.layoutIndex = Math.min(state.layoutIndex, Math.max(0, layouts.length - 1));
  if (state.selected >= n) state.selected = -1;
  state.swapMode = false;
  document.getElementById("empty").style.display = n ? "none" : "flex";
  document.getElementById("btnSave").disabled = n === 0;
  document.getElementById("btnNew").disabled = n === 0;
  renderTab();
  redraw();
}

/* ---------- Interaktion auf der Vorschau ---------- */
const pointers = new Map();
let drag = null;

function cellAt(px, py) {
  const rects = cellRects(view.w, view.h);
  for (let i = rects.length - 1; i >= 0; i--) {
    const r = rects[i];
    if (px >= r.x && px <= r.x + r.w && py >= r.y && py <= r.y + r.h && state.photos[i]) return i;
  }
  return -1;
}
function localPos(e) {
  const b = preview.getBoundingClientRect();
  return { x: e.clientX - b.left, y: e.clientY - b.top };
}
function clamp(v, a, b) { return Math.max(a, Math.min(b, v)); }

preview.addEventListener("pointerdown", e => {
  if (!state.photos.length) return;
  preview.setPointerCapture(e.pointerId);
  const pos = localPos(e);
  pointers.set(e.pointerId, pos);
  if (pointers.size === 1) {
    const hit = cellAt(pos.x, pos.y);
    drag = { cell: hit, startX: pos.x, startY: pos.y, moved: false, pinch: null };
  } else if (pointers.size === 2 && drag && drag.cell >= 0) {
    const [a, b] = [...pointers.values()];
    drag.pinch = { dist: Math.hypot(a.x - b.x, a.y - b.y), zoom: state.photos[drag.cell].zoom };
    drag.moved = true;
  }
});

preview.addEventListener("pointermove", e => {
  if (!pointers.has(e.pointerId) || !drag) return;
  const pos = localPos(e), prev = pointers.get(e.pointerId);
  pointers.set(e.pointerId, pos);
  if (drag.cell < 0) return;
  const p = state.photos[drag.cell];
  if (pointers.size >= 2 && drag.pinch) {
    const [a, b] = [...pointers.values()];
    p.zoom = clamp(drag.pinch.zoom * Math.hypot(a.x - b.x, a.y - b.y) / drag.pinch.dist, 1, 4);
    redraw();
    return;
  }
  if (!drag.moved && Math.hypot(pos.x - drag.startX, pos.y - drag.startY) < 6) return;
  drag.moved = true;
  if (state.selected !== drag.cell || state.swapMode) return;   // verschieben nur bei ausgewähltem Feld
  const r = cellRects(view.w, view.h)[drag.cell];
  const s = Math.max(r.w / p.src.width, r.h / p.src.height) * p.zoom;
  const exX = p.src.width * s - r.w, exY = p.src.height * s - r.h;
  if (exX > 0.5) p.ox = clamp(p.ox + (pos.x - prev.x) / (exX / 2), -1, 1);
  if (exY > 0.5) p.oy = clamp(p.oy + (pos.y - prev.y) / (exY / 2), -1, 1);
  redraw();
});

function endPointer(e) {
  if (!pointers.has(e.pointerId)) return;
  pointers.delete(e.pointerId);
  if (pointers.size === 0 && drag) {
    if (!drag.moved) onTapCell(drag.cell);
    drag = null;
    if (state.tab === "photo") renderTab();
  } else if (pointers.size < 2 && drag) {
    drag.pinch = null;
  }
}
preview.addEventListener("pointerup", endPointer);
preview.addEventListener("pointercancel", endPointer);

function onTapCell(i) {
  if (state.swapMode && state.selected >= 0 && i >= 0 && i !== state.selected) {
    const a = state.selected;
    [state.photos[a], state.photos[i]] = [state.photos[i], state.photos[a]];
    state.selected = i;
    state.swapMode = false;
    toast("Fotos getauscht");
  } else {
    state.swapMode = false;
    state.selected = i === state.selected ? -1 : i;
    if (state.selected >= 0) setTab("photo");
  }
  renderTab();
  redraw();
}

/* ---------- Tabs ---------- */
const tabBody = document.getElementById("tabBody");
function setTab(t) {
  state.tab = t;
  document.querySelectorAll("#tabs button").forEach(b => b.classList.toggle("on", b.dataset.tab === t));
  renderTab();
}
document.querySelectorAll("#tabs button").forEach(b => b.addEventListener("click", () => setTab(b.dataset.tab)));

function el(html) {
  const t = document.createElement("template");
  t.innerHTML = html.trim();
  return t.content.firstElementChild;
}
function slider(label, key, min, max, step, fmt) {
  const row = el(`<div class="row"><label>${label}</label><input type="range" min="${min}" max="${max}" step="${step}"><output></output></div>`);
  const input = row.querySelector("input"), out = row.querySelector("output");
  input.value = state[key];
  out.textContent = fmt(state[key]);
  input.addEventListener("input", () => {
    state[key] = +input.value;
    out.textContent = fmt(state[key]);
    persist();
    redraw();
  });
  return row;
}

function renderTab() {
  tabBody.replaceChildren();
  if (state.tab === "layout") renderLayoutTab();
  else if (state.tab === "style") renderStyleTab();
  else if (state.tab === "text") renderTextTab();
  else if (state.tab === "photo") renderPhotoTab();
  else renderExportTab();
}

function renderLayoutTab() {
  if (!state.photos.length) {
    tabBody.append(el(`<p class="hint">Füge Fotos hinzu, dann erscheinen hier passende Layouts.</p>`));
    return;
  }
  tabBody.append(el(`<p class="hint">${state.photos.length} Foto(s) · Layout wählen</p>`));
  const sc = el(`<div class="scroller"></div>`);
  layouts.forEach((lay, i) => {
    const b = el(`<button class="layout-btn" title="${lay.name}"><canvas width="96" height="96"></canvas></button>`);
    if (i === state.layoutIndex) b.classList.add("active");
    const c = b.querySelector("canvas").getContext("2d");
    c.fillStyle = getComputedStyle(document.body).color;
    lay.rects.forEach(([x, y, w, h]) => c.fillRect(x * 96 + 2, y * 96 + 2, w * 96 - 4, h * 96 - 4));
    b.addEventListener("click", () => { state.layoutIndex = i; renderTab(); redraw(); });
    sc.append(b);
  });
  tabBody.append(sc);
}

function renderStyleTab() {
  const aspectRow = el(`<div class="row"><label>Format</label><div class="scroller" style="flex:1"></div></div>`);
  const sc = aspectRow.querySelector(".scroller");
  ASPECTS.forEach(([name], i) => {
    const b = el(`<button>${name}</button>`);
    if (i === state.aspect) b.classList.add("active");
    b.addEventListener("click", () => { state.aspect = i; persist(); fitPreview(); renderTab(); });
    sc.append(b);
  });
  tabBody.append(aspectRow);
  tabBody.append(slider("Abstand", "gap", 0, 40, 1, v => v));
  tabBody.append(slider("Rand", "pad", 0, 40, 1, v => v));
  tabBody.append(slider("Ecken", "radius", 0, 60, 1, v => v));
  const colorRow = el(`<div class="row"><label>Hintergrund</label><div class="scroller" style="flex:1;align-items:center"></div></div>`);
  const cs = colorRow.querySelector(".scroller");
  COLORS.forEach(c => {
    const b = el(`<button class="swatch" style="background:${c}" aria-label="${c}"></button>`);
    if (c.toLowerCase() === state.bg.toLowerCase()) b.classList.add("on");
    b.addEventListener("click", () => { state.bg = c; persist(); redraw(); renderTab(); });
    cs.append(b);
  });

  picker.addEventListener("input", () => { state.bg = picker.value; persist(); redraw(); });

function selectRow(label, key, opts, onChange) {
  const row = el(`<div class="row"><label>${label}</label><select style="flex:1"></select></div>`);
  const s = row.querySelector("select");
  opts.forEach(([v, t]) => s.append(new Option(t, v)));

function renderTextTab() {
  const toggles = el(`<div class="row"><label>Anzeigen</label><div class="scroller" style="flex:1"></div></div>`);
  const sc = toggles.querySelector(".scroller");
  [["textOn", "Text an"], ["showPlace", "Ort"], ["showDate", "Datum"]].forEach(([k, label]) => {

    if (state[k]) b.classList.add("active");
    b.addEventListener("click", () => {
      state[k] = !state[k];

    });

  tabBody.append(toggles);
  tabBody.append(selectRow("Wo", "textMode", [
    ["photos", "Auf den Fotos"], ["strip", "Eigener Bereich"], ["both", "Beides"]
  ], () => { enableText(); renderTab(); redraw(); }));

  const find = el(`<div class="row"><button id="btnPlaces">Orte aus GPS ermitteln</button></div>`);
  find.querySelector("button").disabled = !state.photos.length;
  find.querySelector("button").addEventListener("click", () => resolvePlaces(state.photos.map((_, i) => i), false));
  tabBody.append(find);
  tabBody.append(el(`<p class="hint">Sendet nur die Koordinaten (nicht die Fotos) an OpenStreetMap, um den Ortsnamen zu finden. Datum und Ort kannst du unter „Foto" auch von Hand ändern.</p>`));

  tabBody.append(selectRow("Position", "textPos", [
    ["bl", "Unten links"], ["bc", "Unten Mitte"], ["br", "Unten rechts"],
    ["tl", "Oben links"], ["tc", "Oben Mitte"], ["tr", "Oben rechts"]
  ]));
  tabBody.append(slider("Größe", "textSize", 6, 40, 1, v => v));

  const colorRow = el(`<div class="row"><label>Farbe</label><div class="scroller" style="flex:1;align-items:center"></div></div>`);
  const cs = colorRow.querySelector(".scroller");
  TEXT_COLORS.forEach(c => {
    const b = el(`<button class="swatch" style="background:${c}" aria-label="${c}"></button>`);
    if (c === state.textColor.toLowerCase()) b.classList.add("on");
    b.addEventListener("click", () => { state.textColor = c; persist(); redraw(); renderTab(); });
    cs.append(b);
  });
  const picker = el(`<input type="color" aria-label="Eigene Farbe">`);
  picker.value = /^#[0-9a-f]{6}$/i.test(state.textColor) ? state.textColor : "#ffffff";
  picker.addEventListener("input", () => { state.textColor = picker.value; persist(); redraw(); });
  picker.addEventListener("change", renderTab);
  cs.append(picker);

  tabBody.append(selectRow("Stil", "textBg", [["outline", "Kontur"], ["bar", "Balken"], ["none", "Ohne"]]));
  tabBody.append(selectRow("Format", "dateFmt", [["num", "18.10.2026"], ["long", "18. Oktober 2026"], ["month", "Oktober 2026"]]));
  if (state.textMode !== "photos") {
    const r = el(`<div class="row"><label>Eigener Text</label><input type="text" placeholder="leer = automatisch"></div>`);
    const inp = r.querySelector("input");
    inp.value = state.stripText;
    inp.addEventListener("input", () => { state.stripText = inp.value; redraw(); });
    tabBody.append(r);
  }
}

function enableText() {
  if (!state.textOn) { state.textOn = true; persist(); }
}

const placeCache = new Map();
let resolving = false;
async function resolvePlaces(indices, force) {
  if (resolving) return;
  const photos = indices.map(i => state.photos[i]).filter(Boolean);
  const withGps = photos.filter(p => p.lat !== null);
  if (!withGps.length) {
    toast("Kein Standort in den Fotos gefunden. Auf dem iPhone beim Auswählen unter „Optionen“ den Standort einschließen, oder den Ort von Hand eintragen.");
    return;
  }
  const todo = withGps.filter(p => force || !p.place);
  resolving = true;
  toast("Orte werden gesucht …");
  let ok = 0;
  try {
    for (let k = 0; k < todo.length; k++) {
      const p = todo[k];
      const key = p.lat.toFixed(2) + "," + p.lon.toFixed(2);
      let place = placeCache.get(key);
      if (place === undefined) {
        const url = `https://nominatim.openstreetmap.org/reverse?format=jsonv2&zoom=12&accept-language=de&lat=${p.lat.toFixed(5)}&lon=${p.lon.toFixed(5)}`;
        const res = await fetch(url);
        if (!res.ok) throw new Error("HTTP " + res.status);
        const a = (await res.json()).address || {};
        const name = a.city || a.town || a.village || a.municipality || a.hamlet || a.suburb || a.county || "";
        place = [name, a.country].filter(Boolean).join(", ");
        placeCache.set(key, place);
        if (k < todo.length - 1) await new Promise(r => setTimeout(r, 1100));   // Nominatim: max. 1 Anfrage/s
      }
      p.place = place;
      if (place) ok++;
    }
    if (ok) enableText();
    const noGps = photos.length - withGps.length;
    toast(`${ok} Ort(e) gefunden` + (noGps ? ` · ${noGps} Foto(s) ohne Standort` : ""));
  } catch (e) {
    toast("Ortssuche fehlgeschlagen. Bist du online?");
  } finally {
    resolving = false;
    renderTab();
    redraw();
  }
}

function removePhoto(i) {
  state.photos.splice(i, 1);
  state.selected = -1;
  afterPhotosChanged();
}

function newCollage(ask) {
  if (ask && state.photos.length && !confirm("Alle Fotos entfernen und eine neue Collage beginnen?")) return;
  state.photos = [];
  state.selected = -1;
  setTab("layout");
  afterPhotosChanged();
}

function showDone(show = true) { document.getElementById("done").hidden = !show; }

function renderPhotoTab() {
  const i = state.selected;
  if (i < 0 || !state.photos[i]) {
    if (!state.photos.length) {
      tabBody.append(el(`<p class="hint">Noch keine Fotos.</p>`));
      return;
    }
    tabBody.append(el(`<p class="hint">Foto antippen zum Bearbeiten, × zum Entfernen.</p>`));
    const strip = el(`<div class="scroller" style="padding-top:8px"></div>`);
    state.photos.forEach((p, k) => {
      const t = el(`<div class="thumb"><canvas width="112" height="112"></canvas><button class="x" aria-label="Foto entfernen">×</button></div>`);
      const c = t.querySelector("canvas").getContext("2d");
      const s = Math.max(112 / p.src.width, 112 / p.src.height);
      c.drawImage(p.src, (112 - p.src.width * s) / 2, (112 - p.src.height * s) / 2, p.src.width * s, p.src.height * s);
      t.querySelector("canvas").addEventListener("click", () => { state.selected = k; renderTab(); redraw(); });
      t.querySelector(".x").addEventListener("click", () => removePhoto(k));
      strip.append(t);
    });
    tabBody.append(strip);
    return;
  }
  const p = state.photos[i];
  tabBody.append(el(`<p class="hint">Foto ${i + 1} · ziehen zum Verschieben, zwei Finger zum Zoomen</p>`));
  const row = el(`<div class="row"><label>Zoom</label><input type="range" min="1" max="4" step="0.01"><output></output></div>`);
  const input = row.querySelector("input"), out = row.querySelector("output");
  input.value = p.zoom;
  out.textContent = p.zoom.toFixed(1) + "×";
  input.addEventListener("input", () => { p.zoom = +input.value; out.textContent = p.zoom.toFixed(1) + "×"; redraw(); });
  tabBody.append(row);

  const showRow = el(`<div class="row"><label>Anzeigen</label><div class="scroller" style="flex:1"></div></div>`);
  [["showPlace", "Ort"], ["showDate", "Datum"]].forEach(([k, label]) => {
    const b = el(`<button>${label}</button>`);
    if (p[k]) b.classList.add("active");
    b.addEventListener("click", () => { p[k] = !p[k]; if (p[k]) enableText(); renderTab(); redraw(); });
    showRow.querySelector(".scroller").append(b);
  });
  const dateRow = el(`<div class="row"><label>Datum</label><input type="text" placeholder="z. B. 18.10.2026"></div>`);
  const di = dateRow.querySelector("input");
  di.value = p.dateText !== null ? p.dateText : fmtDate(p.date);
  di.addEventListener("input", () => { p.dateText = di.value; enableText(); redraw(); });
  const placeRow = el(`<div class="row"><label>Ort</label><input type="text" placeholder="z. B. Hamburg"><button class="small">Aus GPS</button></div>`);
  const pi = placeRow.querySelector("input"), gpsBtn = placeRow.querySelector("button");
  pi.value = p.place;
  pi.addEventListener("input", () => { p.place = pi.value; enableText(); redraw(); });
  gpsBtn.disabled = p.lat === null;
  gpsBtn.title = p.lat === null ? "Dieses Foto enthält keinen Standort" : "";
  gpsBtn.addEventListener("click", async () => { await resolvePlaces([i], true); });
  tabBody.append(showRow, dateRow, placeRow);

  const acts = el(`<div class="sel-actions"></div>`);
  const swap = el(`<button>${state.swapMode ? "Zielfeld antippen …" : "Tauschen"}</button>`);
  if (state.swapMode) swap.classList.add("active");
  swap.disabled = state.photos.length < 2;
  swap.addEventListener("click", () => { state.swapMode = !state.swapMode; renderTab(); redraw(); });
  const reset = el(`<button>Zurücksetzen</button>`);
  reset.addEventListener("click", () => { p.zoom = 1; p.ox = 0; p.oy = 0; renderTab(); redraw(); });
  const del = el(`<button class="danger">Entfernen</button>`);
  del.addEventListener("click", () => removePhoto(i));
  acts.append(swap, reset, del);
  tabBody.append(acts);
}

function renderExportTab() {
  const fmtRow = el(`<div class="row"><label>Dateityp</label><select><option value="jpeg">JPG (kleiner)</option><option value="png">PNG (verlustfrei)</option></select></div>`);
  const fsel = fmtRow.querySelector("select");
  fsel.value = state.format;
  fsel.addEventListener("change", () => { state.format = fsel.value; persist(); });
  const sizeRow = el(`<div class="row"><label>Auflösung</label><select><option value="1080">1080 px</option><option value="2160">2160 px</option><option value="3000">3000 px</option></select></div>`);
  const ssel = sizeRow.querySelector("select");
  ssel.value = String(state.size);
  ssel.addEventListener("change", () => { state.size = +ssel.value; persist(); });

}

/* ---------- Export ---------- */
async function exportBlob() {
  const [, aw, ah] = ASPECTS[state.aspect];
  const long = state.size;
  const W = aw >= ah ? long : Math.round(long * aw / ah);
  const H = aw >= ah ? Math.round(long * ah / aw) : long;
  const c = document.createElement("canvas");
  c.width = W; c.height = H;
  render(c.getContext("2d"), W, H, false);
  const type = state.format === "png" ? "image/png" : "image/jpeg";
  return await new Promise((res, rej) => c.toBlob(b => b ? res(b) : rej(new Error("toBlob")), type, 0.93));
}

document.getElementById("btnSave").addEventListener("click", async () => {
  const btn = document.getElementById("btnSave");
  btn.disabled = true;
  try {
    const blob = await exportBlob();
    const ext = state.format === "png" ? "png" : "jpg";
    const name = `collage-${new Date().toISOString().slice(0, 10)}.${ext}`;
    const file = new File([blob], name, { type: blob.type });
    if (navigator.canShare && navigator.canShare({ files: [file] })) {
      try { await navigator.share({ files: [file], title: "Collage" }); showDone(); }
      catch (e) { if (e.name !== "AbortError") throw e; }
    } else {
      const a = document.createElement("a");
      a.href = URL.createObjectURL(blob);
      a.download = name;
      document.body.append(a);
      a.click();
      a.remove();
      setTimeout(() => URL.revokeObjectURL(a.href), 10000);
      showDone();
    }
  } catch (e) {
    toast("Export fehlgeschlagen. Versuche eine kleinere Auflösung.");
  } finally {
    btn.disabled = state.photos.length === 0;
  }
});

/* ---------- Sonstiges ---------- */
const fileInput = document.getElementById("file");
function pickFiles() { fileInput.click(); }
document.getElementById("btnAdd").addEventListener("click", pickFiles);
document.getElementById("btnAdd2").addEventListener("click", pickFiles);
fileInput.addEventListener("change", async () => {
  await addFiles(fileInput.files);
  fileInput.value = "";
});

document.getElementById("btnNew").addEventListener("click", () => newCollage(true));
document.getElementById("doneNew").addEventListener("click", () => { showDone(false); newCollage(false); });
document.getElementById("doneKeep").addEventListener("click", () => showDone(false));

let toastTimer = 0;
function toast(msg) {
  const t = document.getElementById("toast");
  t.textContent = msg;
  t.classList.add("show");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove("show"), 2800);
}

window.addEventListener("resize", fitPreview);
window.addEventListener("orientationchange", () => setTimeout(fitPreview, 200));
window.matchMedia("(prefers-color-scheme: dark)").addEventListener("change", renderTab);

if ("serviceWorker" in navigator) {
  window.addEventListener("load", () => navigator.serviceWorker.register("sw.js").catch(() => {}));
}

afterPhotosChanged();
fitPreview();
</script>
</body>
</html>
